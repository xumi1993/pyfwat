name: Publish to PyPI

# This workflow triggers when a new release is published on GitHub
# It builds pyfwat-core and pyfwat and publishes both using trusted publishing.
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish core and GUI packages
    runs-on: ubuntu-latest
    
    # IMPORTANT: This permission is mandatory for trusted publishing
    permissions:
      id-token: write  # Required for OIDC authentication to PyPI
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel

    - name: Test package metadata and installation modes
      run: python -m unittest discover -s tests -p test_packaging.py -v
    
    - name: Build core and GUI packages
      run: python scripts/build_distributions.py
    
    - name: Check packages with twine
      run: twine check dist/*

    - name: Stage distributions for ordered publishing
      run: |
        python - <<'PY'
        from pathlib import Path
        import shutil
        for artifact in Path("dist").iterdir():
            package = "core" if artifact.name.startswith(("pyfwat_core-", "pyfwat-core-")) else "gui"
            destination = Path("publish") / package
            destination.mkdir(parents=True, exist_ok=True)
            shutil.copy2(artifact, destination / artifact.name)
        PY

    - name: Publish core to PyPI first
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Using trusted publishing (OIDC) - no API token needed
        # Configure this repo/workflow for BOTH pyfwat and pyfwat-core at:
        # https://pypi.org/manage/account/publishing/
        packages-dir: publish/core/
        verbose: true

    - name: Publish default GUI package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: publish/gui/
        verbose: true
