name: Publish to PyPI

# This workflow triggers when a new release is published on GitHub
# It builds the package and publishes it to PyPI using trusted publishing (OIDC)
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    # IMPORTANT: This permission is mandatory for trusted publishing
    permissions:
      id-token: write  # Required for OIDC authentication to PyPI
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package with twine
      run: twine check dist/*
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Using trusted publishing (OIDC) - no API token needed
        # Must be configured at https://pypi.org/manage/account/publishing/
        verbose: true
